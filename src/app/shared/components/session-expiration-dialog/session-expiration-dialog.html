<p-dialog
  header="Sesión por expirar"
  [visible]="inactivityService.showWarning()"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  styleClass="w-[25rem]"
>
  <div class="flex flex-col items-center text-center gap-4">
    <i class="pi pi-exclamation-triangle text-4xl text-orange-500"></i>

    <p class="m-0">
      Tu sesión expirará en
      <strong> {{inactivityService.remainingSeconds()}}</strong>
      segundos.
    </p>

    <p class="text-sm text-gray-500">¿Deseas continuar conectado?</p>

    <div class="flex gap-2">
      <p-button label="Cerrar sesión" severity="secondary" (onClick)="authStore.logout()" />

      <p-button label="Continuar sesión" (onClick)="continueSession()" />
    </div>
  </div>
</p-dialog>
