<div class="h-dvh flex flex-col">
  <div class="h-[10dvh]">
    <app-header-layout (isOpen)="toggleSidebar()" />
  </div>

  <div class="flex flex-1 min-h-0">
    <aside
      class="shrink-0 overflow-hidden transition-[width] duration-300 ease-in-out"
      [class.w-64]="isSidebarOpen()"
      [class.w-0]="!isSidebarOpen()"
    >
      <app-sidebar-layout (isOpen)="toggleSidebar()" />
    </aside>

    <main class="p-4 w-full min-w-0 min-h-0 flex-1 overflow-hidden">
      <router-outlet />
    </main>
  </div>
</div>
<app-session-expiration-dialog></app-session-expiration-dialog>
<app-session-expirated-dialog></app-session-expirated-dialog>
