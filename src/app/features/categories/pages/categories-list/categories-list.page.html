<div class="h-full flex flex-col p-4 rounded-lg shadow-lg border border-gray-100">
  <!-- Encabezado de la página -->
  <div class="shrink-0 flex justify-between items-center mb-4">
    <h2 class="text-xl font-semibold">Gestión de categorías</h2>

    <div class="flex justify-end items-center gap-4">
      <!-- Búsqueda -->
      <p-iconfield>
        <p-inputicon class="pi pi-search" />

        <input
          pInputText
          pSize="small"
          type="text"
          placeholder="Keyword Search"
          (input)="table.filterGlobal($any($event.target).value, 'contains')"
          class="h-9"
        />
      </p-iconfield>

      <!-- Nueva categoría -->
      <p-button label="Nueva categoría" icon="pi pi-plus" (click)="newCategoryDialog()" />
    </div>
  </div>

  <!-- Área de la tabla -->
  <div class="flex-1 min-h-0">
    <p-table
      #table
      [value]="categories()"
      [loading]="loading()"
      [scrollable]="true"
      scrollHeight="flex"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20]"
      styleClass="p-datatable-sm"
      [globalFilterFields]="['name', 'createdAt']"
    >
      <!-- Header -->
      <ng-template #header>
        <tr>
          <th>ID</th>

          <th pSortableColumn="name">
            Name
            <p-sort-icon field="name"></p-sort-icon>
          </th>

          <th>Description</th>

          <th>Status</th>

          <th pSortableColumn="createdAt">
            Created
            <p-sort-icon field="createdAt"></p-sort-icon>
          </th>

          <th>Acciones</th>
        </tr>
      </ng-template>

      <!-- Body -->
      <ng-template #body let-category>
        <tr>
          <td>{{ category.id }}</td>

          <td>
            {{ category.name }}
          </td>

          <td>
            {{ category.description }}
          </td>

          <td>
            <p-tag
              [severity]="category.isActive ? 'success' : 'danger'"
              [value]="category.isActive ? 'Active' : 'Inactive'"
            />
          </td>

          <td>
            {{ category.createdAt | date: 'dd/MM/yyyy' }}
          </td>
          <td class="flex gap-2">
            <p-button
              icon="pi pi-pencil"
              severity="info"
              (click)="editCategoryDialog(category)"
            ></p-button>
            <p-button severity="danger" icon="pi pi-trash" (click)="deleteCategory(category.id)"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [header]="categorySelected() ? 'Editar categoria' : 'Crear categoria'"
  closable="false"
  [visible]="showDialog()"
  modal
  styleClass="w-1/2"
  draggable="false"
>
  @if (showDialog()) {
    <app-category-form
      [showCancel]="true"
      (save)="saveCategory($event)"
      (cancel)="onCancel()"
    ></app-category-form>
  }
</p-dialog>
<p-confirmdialog />
